<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Javier Muñoz Parra">
    <script src="ejercicios.js"></script>
    <title>T2_R4_Ej1</title>
</head>
<body>
    <script>
        //apartado A
        cadena = prompt("Introduzca una cadena para invertirla:")
        document.write(`<p>La cadena invertida ${cadena} es: ${invierteCadena(cadena)}</p>`);
        
        //apartado B
        cadena2 = prompt("Introduzca una cadena para invertir sus palabras:")
        document.write(`<p>La cadena invertida ${cadena2} es: ${inviertePalabras(cadena2)}</p>`)

        //apartado C
        cadena3 = prompt("Introduzca una cadena para invertir sus palabras:")
        document.write(`<p>La palabra más larga de la cadena ${cadena3} es: ${encuentraPalabraMasLarga(cadena3)}</p>`)

        cadena4 = prompt("Introduzca una cadena para invertir sus palabras:")
        i = parseInt(prompt("Introduzca el limite minimo de caracteres de cada elemento de la cadena"))
        document.write(`<p>En la cadena ${cadena4}  ${filtraPalabrasMasLargas(cadena4, i)}`) 
        
        cadena5 = prompt("Introduzca una cadena para bienformarla:")
        document.write(`<p>La cadena ${cadena5} bienformada es, ${cadenaBienFormada(cadena5)}</p>`)
    </script>
</body>
</html>
