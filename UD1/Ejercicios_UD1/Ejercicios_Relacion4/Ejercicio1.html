  <body>
    <script>
        debugger;
      function sum(...args) {
        let total = 0;
        document.write(`Los numeros probados son: `)
        for (let i = 0; i < args.length; i++) {
            document.write(`${args[i]}, `);
        }

        for (let i = 0; i < args.length; i++) {
          
          total += args[i];
        } 

        return "<br><br> El total de la suma de todos los numeros es de: " + total;
      }

      let sumaNumeros = sum(5, 4, 3, 8);

      document.write(sumaNumeros);
    </script>
  </body>
