<body>
    <script>
        //Este bucle lo que hace es poner lo que hay en "i" delante de la "h" para así generar la cabecera
        //en h1, luego h2, y asi sucesivamente...
        for (let i = 1; i <= 6 ; i++) {
            document.write(`<h${i}> Cabecera h${i} </h${i}`) 
            document.write(`<br> <br>`)
            
        }
    </script>
