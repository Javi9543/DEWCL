<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        let j1 = parseInt(prompt("Introduzca el numero secreto"));
        let j2 = parseInt(prompt("Averigüe el numero secreto"));
        
        while (j1 != j2) {

            if (j2 > j1) {
                alert("El numero secreto, es más pequeño")
            } else if (j2 < j1){
                alert("El numero secreto, es más grande")
            } 

            j2 = parseInt(prompt("Averigüe el numero secreto"));
            
        }

        document.write(`<p>Enhorabuena has acertado el numero</p>`)
        
    </script>
</body>
</html>
