<body>
    
    <script>
        document.write(`<p>La operacion de 20==20 es ${20 == 20} </p>`);
        document.write(`<p>La operacion de 20===20 es ${20 === 20} </p>`);
        document.write(`<p>La operacion de 20 === 20.0 es ${20 === 20.0}</p>`);
        document.write(`<p>La operacion de "Juan" == "juan" es ${"Juan" == "juan"}</p>`);
        document.write(`<p>La operación de "Juan" > "juan" es ${"Juan" > "juan"}</p>`);
        document.write(`<p>La operación de "Juan" < "juan" es ${"Juan" < "juan"}</p>`);
        document.write(`<p>La operación de "123" == 123 es ${"123" == 123}`);
        document.write(`<p>La operación de "123 === 123 es ${"123"=== 123}`);
        document.write(`<p>La operación de parseInt("123") === 123 es ${parseInt("123") == 123}</p>`);
    </script>
    <br>
    <br>
</body>
