    <script>
        //Creo esta variable, para guardar la edad del usuario para podre comprobar si es mayor de edad
        //o no, más adelante.
        let edad = parseInt(prompt("Introduzca su edad"));
        debugger;
        //Aqui cojo la edad introducida por el usuario anteriormente, y uso el condicional ternario para comprobar
        //si es mayor de edad.
        document.write(`<p> Eres ${ edad > 17 ? "mayor de edad": "menor de edad"} </p>`);

    </script>
