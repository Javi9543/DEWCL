<body>
    <script>
        document.write(`<p>Lo que hace este codigo con countdown-- es que va contando hacia atras desde el numero que intorduce el usuario hasta 0 </p>`)
        document.write(`<p>Lo que hace el codigo con countdown++, es que de manera indefinida va sumando 1 hasta infinto <br> desde el numero que ha introducido el usuario</p>`)
        var countdown = prompt("Introduce un número para iniciar la cuenta atrás")
        while (countdown>0) {
            alert(countdown+ "...");
            countdown--;
            //countdown++;
        }
    </script>
