<body>
    <div id="contenedor">

    </div>

    <button onclick="buscarPalabra(parrafos)"> Pulsame!</button>

    <script>
        const parrafos = ["El perro ladra", "El gato duerme", "El coche se mueve"];

        const cont = document.getElementById("contenedor");

        parrafos.forEach(parrafo => cont.innerHTML += `<p>${parrafo}</p>`);
    </script>
